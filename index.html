<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>PIXEL MECHA BATTLE - 像素机甲对战</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <header class="title-bar">
      <h1>PIXEL MECHA BATTLE</h1>
      <p class="subtitle">像素机甲对战 · 8-BIT ARENA</p>
    </header>

    <div class="stage">
      <canvas id="game" width="640" height="360"></canvas>
      <div class="hud">
        <div class="hp-block p1">
          <span class="label">P1 · 蓝甲</span>
          <div class="hp-bar"><div id="hp1" class="hp-fill"></div></div>
        </div>
        <div class="center-info">
          <div id="round-tag">READY</div>
          <div id="timer">00:00</div>
        </div>
        <div class="hp-block p2">
          <span class="label">P2 · 红甲</span>
          <div class="hp-bar"><div id="hp2" class="hp-fill"></div></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="col">
        <h3>P1 操作</h3>
        <ul>
          <li>移动：<kbd>A</kbd> <kbd>D</kbd></li>
          <li>跳跃：<kbd>W</kbd></li>
          <li>攻击：<kbd>J</kbd></li>
          <li>防御：<kbd>K</kbd>（按住）</li>
        </ul>
      </div>
      <div class="col center-col">
        <button id="restart">重新开始 (R)</button>
        <p class="tip">击败对手：将对方血量打到 0</p>
      </div>
      <div class="col">
        <h3>P2 操作</h3>
        <ul>
          <li>移动：<kbd>←</kbd> <kbd>→</kbd></li>
          <li>跳跃：<kbd>↑</kbd></li>
          <li>攻击：<kbd>4</kbd>（小键盘）</li>
          <li>防御：<kbd>5</kbd>（小键盘，按住）</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
