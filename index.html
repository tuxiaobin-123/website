<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>水果合成挑战</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      flex-shrink: 0;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
    }

    .score-board {
      display: flex;
      gap: 20px;
    }

    .score-item {
      text-align: center;
    }

    .score-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .score-value {
      font-size: 24px;
      font-weight: bold;
      color: #FF6B6B;
    }

    .game-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #E0F7FA 0%, #FFF8E1 100%);
      border-top: 2px solid rgba(0, 0, 0, 0.1);
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .drop-zone {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      border-bottom: 2px dashed rgba(0, 0, 0, 0.2);
      pointer-events: none;
    }

    .next-fruit {
      position: absolute;
      top: 80px;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 10;
    }

    .next-fruit .fruit {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .guide-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #999;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 100;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      max-width: 80%;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .screen.active .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 16px;
    }

    .modal-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .modal-score {
      font-size: 36px;
      font-weight: bold;
      color: #FF6B6B;
      margin-bottom: 8px;
    }

    .modal-high-score {
      font-size: 14px;
      color: #999;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .tutorial {
      margin-top: 20px;
      text-align: left;
      font-size: 14px;
      color: #666;
      line-height: 2;
    }

    .tutorial-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .fruit-size-1 { width: 30px; height: 30px; }
    .fruit-size-2 { width: 45px; height: 45px; }
    .fruit-size-3 { width: 60px; height: 60px; }
    .fruit-size-4 { width: 80px; height: 80px; }
    .fruit-size-5 { width: 100px; height: 100px; }
    .fruit-size-6 { width: 125px; height: 125px; }
    .fruit-size-7 { width: 150px; height: 150px; }
    .fruit-size-8 { width: 180px; height: 180px; }

    @media (max-width: 375px) {
      .header {
        padding: 15px;
        padding-top: max(15px, env(safe-area-inset-top));
      }
      .score-value {
        font-size: 20px;
      }
      .modal-card {
        padding: 24px;
        width: 280px;
      }
      .modal-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="score-board">
        <div class="score-item">
          <div class="score-label">当前得分</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-item">
          <div class="score-label">最高记录</div>
          <div class="score-value" id="high-score">0</div>
        </div>
      </div>
    </div>

    <div class="game-area" id="game-area">
      <canvas id="canvas"></canvas>
      <div class="drop-zone"></div>
      <div class="guide-text">左右滑动控制位置，点击或松手释放水果</div>
    </div>

    <div id="screen-start" class="screen active" aria-hidden="false">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="screen-start-title">
        <h2 id="screen-start-title" class="modal-title">水果合成挑战</h2>
        <p class="modal-message">将相同的水果合并，合成更大的水果！看看你能合成多大~</p>
        <div class="tutorial">
          <div class="tutorial-title">玩法说明</div>
          <div>🍓 点击屏幕左右移动水果位置</div>
          <div>🍎 松手或点击释放水果</div>
          <div>🍊 相同水果相遇会合并升级</div>
          <div>🍉 水果超出顶部则挑战结束</div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" data-action="start">开始挑战</button>
        </div>
      </div>
    </div>

    <div id="screen-over" class="screen" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="screen-over-title">
        <h2 id="screen-over-title" class="modal-title">挑战结束</h2>
        <p class="modal-message">本轮挑战已结束</p>
        <div class="modal-score" id="final-score">0</div>
        <div class="modal-high-score" id="final-high-score">最高记录：0</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" data-action="restart">再来一次</button>
          <button type="button" class="btn btn-secondary" data-action="home">返回首页</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FRUITS = [
      { id: 0, name: '葡萄', color: '#8B5CF6', radius: 15, score: 2 },
      { id: 1, name: '樱桃', color: '#EF4444', radius: 22, score: 4 },
      { id: 2, name: '橘子', color: '#F97316', radius: 30, score: 8 },
      { id: 3, name: '柠檬', color: '#FACC15', radius: 40, score: 16 },
      { id: 4, name: '猕猴桃', color: '#84CC16', radius: 50, score: 32 },
      { id: 5, name: '番茄', color: '#DC2626', radius: 62, score: 64 },
      { id: 6, name: '桃子', color: '#FB7185', radius: 75, score: 128 },
      { id: 7, name: '西瓜', color: '#22C55E', radius: 90, score: 256 }
    ];

    const STORAGE_KEY = 'fruit_merge_high_score';

    class Game {
      constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.gameArea = document.getElementById('game-area');
        this.scoreEl = document.getElementById('score');
        this.highScoreEl = document.getElementById('high-score');
        
        this.width = 0;
        this.height = 0;
        this.score = 0;
        this.highScore = this.loadHighScore();
        this.isPlaying = false;
        this.isPaused = false;
        
        this.fruits = [];
        this.currentFruit = null;
        this.nextFruitType = this.getRandomFruit();
        this.currentFruitType = this.getRandomFruit();
        
        this.gravity = 0.3;
        this.friction = 0.99;
        this.bounce = 0.6;
        this.speedLimit = 15;
        
        this.touchX = 0;
        this.dropLineY = 60;
        
        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.gameArea.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
        this.gameArea.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
        this.gameArea.addEventListener('touchend', () => this.handleTouchEnd());
        
        this.gameArea.addEventListener('mousemove', (e) => this.handleMouseMove(e));
        this.gameArea.addEventListener('click', () => this.handleClick());
        
        this.highScoreEl.textContent = this.highScore;
        
        this.bindScreenEvents();
      }

      loadHighScore() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? parseInt(saved, 10) : 0;
        } catch {
          return 0;
        }
      }

      saveHighScore() {
        try {
          localStorage.setItem(STORAGE_KEY, this.highScore.toString());
        } catch {
          console.log('Storage not available');
        }
      }

      resize() {
        const rect = this.gameArea.getBoundingClientRect();
        this.width = rect.width;
        this.height = rect.height;
        this.canvas.width = this.width * window.devicePixelRatio;
        this.canvas.height = this.height * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        if (this.currentFruit && !this.currentFruit.dropped) {
          this.currentFruit.x = Math.min(Math.max(this.currentFruit.x, this.currentFruit.radius), this.width - this.currentFruit.radius);
        }
      }

      getRandomFruit() {
        const maxLevel = Math.floor(Math.random() * 3);
        return Math.min(maxLevel, FRUITS.length - 1);
      }

      start() {
        this.score = 0;
        this.fruits = [];
        this.isPlaying = true;
        this.isPaused = false;
        this.nextFruitType = this.getRandomFruit();
        this.currentFruitType = this.getRandomFruit();
        this.createCurrentFruit();
        this.updateScore();
        this.loop();
      }

      createCurrentFruit() {
        const fruitData = FRUITS[this.currentFruitType];
        this.currentFruit = {
          x: this.width / 2,
          y: this.dropLineY + fruitData.radius,
          vx: 0,
          vy: 0,
          radius: fruitData.radius,
          type: this.currentFruitType,
          color: fruitData.color,
          dropped: false,
          merged: false
        };
      }

      handleTouchStart(e) {
        if (!this.isPlaying || this.isPaused) return;
        e.preventDefault();
        const touch = e.touches[0];
        this.touchX = touch.clientX - this.gameArea.getBoundingClientRect().left;
      }

      handleTouchMove(e) {
        if (!this.isPlaying || this.isPaused || !this.currentFruit || this.currentFruit.dropped) return;
        e.preventDefault();
        const touch = e.touches[0];
        const rect = this.gameArea.getBoundingClientRect();
        let x = touch.clientX - rect.left;
        x = Math.min(Math.max(x, this.currentFruit.radius), this.width - this.currentFruit.radius);
        this.currentFruit.x = x;
      }

      handleTouchEnd() {
        if (!this.isPlaying || this.isPaused || !this.currentFruit || this.currentFruit.dropped) return;
        this.dropFruit();
      }

      handleMouseMove(e) {
        if (!this.isPlaying || this.isPaused || !this.currentFruit || this.currentFruit.dropped) return;
        const rect = this.gameArea.getBoundingClientRect();
        let x = e.clientX - rect.left;
        x = Math.min(Math.max(x, this.currentFruit.radius), this.width - this.currentFruit.radius);
        this.currentFruit.x = x;
      }

      handleClick() {
        if (!this.isPlaying || this.isPaused || !this.currentFruit || this.currentFruit.dropped) return;
        this.dropFruit();
      }

      dropFruit() {
        if (!this.currentFruit) return;
        this.currentFruit.dropped = true;
        this.fruits.push(this.currentFruit);
        this.currentFruitType = this.nextFruitType;
        this.nextFruitType = this.getRandomFruit();
        this.createCurrentFruit();
      }

      update() {
        if (!this.isPlaying || this.isPaused) return;

        this.fruits.forEach(fruit => {
          if (fruit.merged) return;
          
          fruit.vy += this.gravity;
          fruit.vy = Math.min(fruit.vy, this.speedLimit);
          fruit.vx *= this.friction;
          
          fruit.x += fruit.vx;
          fruit.y += fruit.vy;
          
          if (fruit.x - fruit.radius < 0) {
            fruit.x = fruit.radius;
            fruit.vx *= -this.bounce;
          }
          if (fruit.x + fruit.radius > this.width) {
            fruit.x = this.width - fruit.radius;
            fruit.vx *= -this.bounce;
          }
          if (fruit.y + fruit.radius > this.height) {
            fruit.y = this.height - fruit.radius;
            fruit.vy *= -this.bounce;
          }
        });

        this.checkCollisions();
        this.checkGameOver();
      }

      checkCollisions() {
        for (let i = 0; i < this.fruits.length; i++) {
          const f1 = this.fruits[i];
          if (f1.merged) continue;
          
          for (let j = i + 1; j < this.fruits.length; j++) {
            const f2 = this.fruits[j];
            if (f2.merged) continue;
            
            const dx = f2.x - f1.x;
            const dy = f2.y - f1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = f1.radius + f2.radius;
            
            if (dist < minDist) {
              const overlap = minDist - dist;
              const nx = dx / dist;
              const ny = dy / dist;
              
              f1.x -= nx * overlap / 2;
              f1.y -= ny * overlap / 2;
              f2.x += nx * overlap / 2;
              f2.y += ny * overlap / 2;
              
              if (f1.type === f2.type && f1.type < FRUITS.length - 1) {
                this.mergeFruits(f1, f2);
              } else {
                const dvx = f2.vx - f1.vx;
                const dvy = f2.vy - f1.vy;
                const dvn = dvx * nx + dvy * ny;
                
                if (dvn < 0) {
                  f1.vx -= dvn * nx * 0.5;
                  f1.vy -= dvn * ny * 0.5;
                  f2.vx += dvn * nx * 0.5;
                  f2.vy += dvn * ny * 0.5;
                }
              }
            }
          }
        }
        
        this.fruits = this.fruits.filter(f => !f.merged);
      }

      mergeFruits(f1, f2) {
        const newType = f1.type + 1;
        const newFruit = FRUITS[newType];
        
        const mergedFruit = {
          x: (f1.x + f2.x) / 2,
          y: (f1.y + f2.y) / 2,
          vx: (f1.vx + f2.vx) / 2,
          vy: (f1.vy + f2.vy) / 2 - 2,
          radius: newFruit.radius,
          type: newType,
          color: newFruit.color,
          dropped: true,
          merged: false
        };
        
        f1.merged = true;
        f2.merged = true;
        this.fruits.push(mergedFruit);
        
        this.score += newFruit.score;
        this.updateScore();
        
        if (this.score > this.highScore) {
          this.highScore = this.score;
          this.saveHighScore();
          this.highScoreEl.textContent = this.highScore;
        }
      }

      checkGameOver() {
        for (const fruit of this.fruits) {
          if (fruit.y - fruit.radius < this.dropLineY) {
            this.gameOver();
            return;
          }
        }
      }

      gameOver() {
        this.isPlaying = false;
        showScreen('screen-over');
        document.getElementById('final-score').textContent = this.score;
        document.getElementById('final-high-score').textContent = `最高记录：${this.highScore}`;
      }

      updateScore() {
        this.scoreEl.textContent = this.score;
      }

      draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);
        
        this.fruits.forEach(fruit => {
          this.drawFruit(fruit);
        });
        
        if (this.currentFruit && this.isPlaying) {
          this.drawFruit(this.currentFruit);
          this.drawDropLine();
        }
        
        this.drawNextFruit();
      }

      drawFruit(fruit) {
        const gradient = this.ctx.createRadialGradient(
          fruit.x - fruit.radius * 0.3,
          fruit.y - fruit.radius * 0.3,
          0,
          fruit.x,
          fruit.y,
          fruit.radius
        );
        
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(0.4, fruit.color);
        gradient.addColorStop(1, this.darkenColor(fruit.color, 30));
        
        this.ctx.beginPath();
        this.ctx.arc(fruit.x, fruit.y, fruit.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = gradient;
        this.ctx.fill();
        
        this.ctx.beginPath();
        this.ctx.arc(fruit.x - fruit.radius * 0.3, fruit.y - fruit.radius * 0.3, fruit.radius * 0.15, 0, Math.PI * 2);
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        this.ctx.fill();
        
        this.ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        this.ctx.shadowBlur = 10;
        this.ctx.shadowOffsetY = 5;
        this.ctx.fill();
        this.ctx.shadowColor = 'transparent';
        this.ctx.shadowBlur = 0;
        this.ctx.shadowOffsetY = 0;
      }

      drawDropLine() {
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.dropLineY);
        this.ctx.lineTo(this.width, this.dropLineY);
        this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
        this.ctx.lineWidth = 2;
        this.ctx.setLineDash([10, 10]);
        this.ctx.stroke();
        this.ctx.setLineDash([]);
      }

      drawNextFruit() {
        const nextData = FRUITS[this.nextFruitType];
        const x = this.width / 2;
        const y = this.dropLineY + nextData.radius + 50;
        
        const gradient = this.ctx.createRadialGradient(
          x - nextData.radius * 0.3,
          y - nextData.radius * 0.3,
          0,
          x,
          y,
          nextData.radius
        );
        
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(0.4, nextData.color);
        gradient.addColorStop(1, this.darkenColor(nextData.color, 30));
        
        this.ctx.beginPath();
        this.ctx.arc(x, y, nextData.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = gradient;
        this.ctx.fill();
        
        this.ctx.font = '12px sans-serif';
        this.ctx.fillStyle = '#666';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('下一个', x, y + nextData.radius + 20);
      }

      darkenColor(color, amount) {
        const hex = color.replace('#', '');
        const r = Math.max(0, parseInt(hex.substr(0, 2), 16) - amount);
        const g = Math.max(0, parseInt(hex.substr(2, 2), 16) - amount);
        const b = Math.max(0, parseInt(hex.substr(4, 2), 16) - amount);
        return `rgb(${r}, ${g}, ${b})`;
      }

      loop() {
        this.update();
        this.draw();
        if (this.isPlaying) {
          requestAnimationFrame(() => this.loop());
        }
      }

      bindScreenEvents() {
        document.querySelectorAll('.btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const action = e.target.getAttribute('data-action');
            if (action === 'start' || action === 'restart') {
              hideAllScreens();
              this.start();
            } else if (action === 'home') {
              showScreen('screen-start');
            }
          });
        });
      }
    }

    function hideAllScreens() {
      document.querySelectorAll('.screen').forEach((node) => {
        node.classList.remove('active');
        node.setAttribute('aria-hidden', 'true');
      });
    }

    function showScreen(id) {
      hideAllScreens();
      const target = document.getElementById(id);
      if (!target) return;
      target.classList.add('active');
      target.setAttribute('aria-hidden', 'false');
    }

    window.addEventListener('load', () => {
      try {
        const game = new Game();
        window.game = game;
      } catch (error) {
        console.error(error);
        const fallback = document.createElement('div');
        fallback.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-size:18px;padding:24px;text-align:center;z-index:9999;';
        fallback.textContent = '哎呀，出错了，请重启试试吧~';
        document.body.innerHTML = '';
        document.body.appendChild(fallback);
      }
    });
  </script>
</body>
</html>
